name: CI/CD Pipeline - Barber Man

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Testes Automatizados & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Permissão de Execução no Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Executar Todos os Testes Automatizados (57 Testes)
        working-directory: ./backend
        run: ./mvnw clean test

      - name: Compilar Pacote de Produção JAR
        working-directory: ./backend
        run: ./mvnw package -DskipTests

      - name: Upload do Artefato JAR Compilado
        uses: actions/upload-artifact@v4
        with:
          name: barber-man-api-jar
          path: backend/target/barber-man-api-*.jar
          retention-days: 7

  docker-and-security:
    name: Validação Docker, Nginx & Segurança
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Validação de Segurança (Verificar se .env não foi exposto no Git)
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERRO CRÍTICO DE SEGURANÇA: O arquivo .env está versionado no Git!"
            exit 1
          else
            echo "Segurança OK: .env não está rastreado no repositório."
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testar Build da Imagem Docker do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: barber-man-api:ci-test

      - name: Validar Sintaxe de Configuração do Nginx
        run: |
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/privkey.pem \
            -out nginx/ssl/fullchain.pem \
            -subj "/CN=ci-test"
          docker run --rm \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/nginx/conf.d:/etc/nginx/conf.d:ro \
            -v ${{ github.workspace }}/nginx/blocked_ips.conf:/etc/nginx/blocked_ips.conf:ro \
            -v ${{ github.workspace }}/nginx/ssl:/etc/nginx/ssl:ro \
            -v ${{ github.workspace }}/frontend:/usr/share/nginx/html:ro \
            nginx:alpine nginx -t

      - name: Validar Arquivo docker-compose.yml
        run: |
          docker compose config
