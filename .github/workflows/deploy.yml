name: Deploy Automático - Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy na VPS Oracle
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            echo "Iniciando deploy automático do BarberNotify..."
            # Encontra e acessa o diretório do projeto
            if [ -d "$HOME/BarberNotify" ]; then
              cd "$HOME/BarberNotify"
            elif [ -d "/home/ubuntu/BarberNotify" ]; then
              cd "/home/ubuntu/BarberNotify"
            elif [ -d "/home/opc/BarberNotify" ]; then
              cd "/home/opc/BarberNotify"
            elif [ -d "/var/www/BarberNotify" ]; then
              cd "/var/www/BarberNotify"
            else
              cd "$(find /home /var/www -maxdepth 3 -name BarberNotify 2>/dev/null | head -n 1)"
            fi

            echo "Baixando atualizações do GitHub..."
            git pull origin main

            DOCKER_CMD="docker compose"
            if ! docker ps >/dev/null 2>&1; then
              if sudo docker ps >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker compose"
              fi
            fi

            echo "Atualizando containers com $DOCKER_CMD..."
            $DOCKER_CMD up -d --build backend evolution_api
            $DOCKER_CMD restart frontend || docker exec barber_man_frontend nginx -s reload || sudo docker exec barber_man_frontend nginx -s reload

            echo "Deploy concluído com sucesso!"
