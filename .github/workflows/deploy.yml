name: Deploy Automático - Oracle Cloud (BarberNotify + BarberAdmin)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy na VPS Oracle
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            DOCKER_CLI="docker"
            if ! docker ps >/dev/null 2>&1; then
              DOCKER_CLI="sudo docker"
            fi
            NOTIFY_DIR="$(find /home /var/www /root -maxdepth 3 -name BarberNotify 2>/dev/null | head -n 1)"
            {
              echo "=== DOCKER PS -A ==="
              $DOCKER_CLI ps -a 2>&1 || true
              echo "=== LOGS BARBER_ADMIN_BACKEND ==="
              $DOCKER_CLI logs --tail 60 barber_admin_backend 2>&1 || true
              echo "=== INSPECT BARBER_ADMIN_POSTGRES NETWORKS ==="
              $DOCKER_CLI inspect barber_admin_postgres 2>&1 | grep -A 25 '"Networks"' || true
            } > "$NOTIFY_DIR/frontend/vps-status.txt"
