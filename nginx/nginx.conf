user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Oculta versao do Nginx para evitar fingerprinting de seguranca
    server_tokens off;

    # Otimizacoes de I/O de rede
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Compressao Gzip de alta performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================
    # RATE LIMITING (Controle de Requisicoes por IP)
    # ==========================================
    # 1. API: Limite de 10 requisicoes por segundo por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Frontend Estatico: Limite de 30 requisicoes por segundo por IP
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;

    # 3. Conexoes Simultaneas: Maximo de conexoes ativas por IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Codigo HTTP retornado ao exceder o rate limit (429 Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # Incluir configuracoes dos sites (HTTP/HTTPS e rotas)
    include /etc/nginx/conf.d/*.conf;
}
