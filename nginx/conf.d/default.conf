# ==============================================================================
# CONFIGURACAO DO SERVIDOR WEB & REVERSE PROXY - BARBER MAN
# ==============================================================================

# Bloco 1: HTTP (Porta 80)
# Responsavel pela validacao de certificados Let's Encrypt / Certbot e redirecionamento HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fillipython.ddns.net 163.176.200.18 _;

    # Importa regras de bloqueio por IP (Blacklist)
    include /etc/nginx/blocked_ips.conf;

    # Desafio ACME para geracao e renovacao automatica de certificados SSL (Certbot)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Headers de Seguranca Essenciais
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirecionamento da rota sem barra /BarberNotify para /BarberNotify/
    location = /BarberNotify {
        return 301 /BarberNotify/;
    }

    # API Spring Boot do BarberNotify com Rate Limiting
    location ^~ /BarberNotify/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;

        # Repasse de Headers e Identidade do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts de Conexao
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Aplicacao BarberNotify (Servida exclusivamente no subcaminho /BarberNotify/)
    location ^~ /BarberNotify/ {
        limit_req zone=static_limit burst=50 nodelay;
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Portal raiz do servidor (exclusivo para navegacao de servicos)
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fillipython Services</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#09090b;color:#f4f4f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}.portal-card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:36px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.4);}.portal-badge{display:inline-block;background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:0.75rem;font-weight:700;letter-spacing:0.05em;padding:4px 12px;border-radius:9999px;margin-bottom:16px;text-transform:uppercase;}h1{font-size:1.5rem;font-weight:700;margin-bottom:8px;color:#ffffff;}p{color:#a1a1aa;font-size:0.95rem;margin-bottom:24px;line-height:1.5;}.service-link{display:flex;align-items:center;justify-content:space-between;background:#27272a;border:1px solid #3f3f46;color:#ffffff;padding:14px 18px;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.95rem;transition:all 0.2s ease;}.service-link:hover{background:#c5a880;color:#18181b;border-color:#c5a880;transform:translateY(-2px);box-shadow:0 4px 12px rgba(197,168,128,0.25);}.service-tag{font-size:0.75rem;opacity:0.8;font-weight:500;}</style></head><body><div class="portal-card"><span class="portal-badge">Servidor Operacional</span><h1>Fillipython Services</h1><p>Aplica&ccedil;&otilde;es ativas neste servidor:</p><a href="/BarberNotify/" class="service-link"><span>Barber Man (BarberNotify)</span><span class="service-tag">&rarr;</span></a></div></body></html>';
    }

    # Demais caminhos desconhecidos na raiz: 404 (livre para futuros servicos)
    location / {
        default_type text/plain;
        return 404 "404 Not Found - Recurso inexistente neste servidor.\n";
    }
}

# Bloco 2: HTTPS (Porta 443 com SSL / TLS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fillipython.ddns.net 163.176.200.18 _;

    # Importa regras de bloqueio por IP (Blacklist)
    include /etc/nginx/blocked_ips.conf;

    # Caminhos dos Certificados SSL (Certbot ou Certificados Proprios)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protocolos e Cifras Modernas e Seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de Seguranca Reforcados (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirecionamento da rota sem barra /BarberNotify para /BarberNotify/
    location = /BarberNotify {
        return 301 /BarberNotify/;
    }

    # API Spring Boot do BarberNotify com Rate Limiting Seguro
    location ^~ /BarberNotify/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;

        # Repasse de Headers e Identidade do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts de Conexao
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Aplicacao BarberNotify (Servida exclusivamente no subcaminho /BarberNotify/)
    location ^~ /BarberNotify/ {
        limit_req zone=static_limit burst=50 nodelay;
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Portal raiz do servidor (exclusivo para navegacao de servicos)
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fillipython Services</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#09090b;color:#f4f4f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}.portal-card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:36px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.4);}.portal-badge{display:inline-block;background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:0.75rem;font-weight:700;letter-spacing:0.05em;padding:4px 12px;border-radius:9999px;margin-bottom:16px;text-transform:uppercase;}h1{font-size:1.5rem;font-weight:700;margin-bottom:8px;color:#ffffff;}p{color:#a1a1aa;font-size:0.95rem;margin-bottom:24px;line-height:1.5;}.service-link{display:flex;align-items:center;justify-content:space-between;background:#27272a;border:1px solid #3f3f46;color:#ffffff;padding:14px 18px;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.95rem;transition:all 0.2s ease;}.service-link:hover{background:#c5a880;color:#18181b;border-color:#c5a880;transform:translateY(-2px);box-shadow:0 4px 12px rgba(197,168,128,0.25);}.service-tag{font-size:0.75rem;opacity:0.8;font-weight:500;}</style></head><body><div class="portal-card"><span class="portal-badge">Servidor Operacional</span><h1>Fillipython Services</h1><p>Aplica&ccedil;&otilde;es ativas neste servidor:</p><a href="/BarberNotify/" class="service-link"><span>Barber Man (BarberNotify)</span><span class="service-tag">&rarr;</span></a></div></body></html>';
    }

    # Demais caminhos desconhecidos na raiz: 404 (livre para futuros servicos)
    location / {
        default_type text/plain;
        return 404 "404 Not Found - Recurso inexistente neste servidor.\n";
    }
}
