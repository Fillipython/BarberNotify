# ==============================================================================
# CONFIGURACAO DO SERVIDOR WEB & REVERSE PROXY - BARBER MAN
# ==============================================================================

# Bloco 1: HTTP (Porta 80)
# Responsavel pela validacao de certificados Let's Encrypt / Certbot e redirecionamento HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Importa regras de bloqueio por IP (Blacklist)
    include /etc/nginx/blocked_ips.conf;

    # Desafio ACME para geracao e renovacao automatica de certificados SSL (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirecionamento permanente para HTTPS (descomente em producao com SSL ativo)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Fallback HTTP caso SSL ainda nao esteja instalado:
    root /usr/share/nginx/html;
    index index.html;

    # Headers de Seguranca Essenciais
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Roteamento da API Spring Boot com Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;

        # Repasse de Headers e Identidade do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts de Conexao
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Cache de arquivos estaticos (Imagens, CSS, JS, Fontes)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Aplicacao Frontend (SPA / Vue 3)
    location / {
        limit_req zone=static_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

# Bloco 2: HTTPS (Porta 443 com SSL / TLS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Importa regras de bloqueio por IP (Blacklist)
    include /etc/nginx/blocked_ips.conf;

    # Caminhos dos Certificados SSL (Certbot ou Certificados Proprios)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Protocolos e Cifras Modernas e Seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de Seguranca Reforcados (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Roteamento da API Spring Boot com Rate Limiting Seguro
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8081/api/;
        proxy_http_version 1.1;

        # Repasse de Headers e Identidade do Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts de Conexao
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Cache de arquivos estaticos (Imagens, CSS, JS, Fontes)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Aplicacao Frontend (SPA / Vue 3)
    location / {
        limit_req zone=static_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
