services:
  # Base de Dados Relacional - PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: barber_man_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber_man_network

  # Gerenciador Web de Banco de Dados - Adminer
  adminer:
    image: adminer:latest
    container_name: barber_man_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - barber_man_network

  # Aplicacao Web Frontend - Vue 3
  frontend:
    image: nginx:alpine
    container_name: barber_man_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - barber_man_network

  # Backend API - Spring Boot 3 & Java 21
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barber_man_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 8081
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - barber_man_network

volumes:
  pgdata:
    driver: local

networks:
  barber_man_network:
    driver: bridge
