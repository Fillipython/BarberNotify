services:
  # Base de Dados Relacional - PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: barber_man_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber_man_network

  # Gateway / Reverse Proxy & Frontend - Nginx (SSL, Rate Limiting, Cache, IP Blocking)
  frontend:
    image: nginx:alpine
    container_name: barber_man_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/blocked_ips.conf:/etc/nginx/blocked_ips.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - barber_man_network

  # Backend API - Spring Boot 3 & Java 21
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barber_man_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 8081
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_API_URL: http://evolution_api:8080
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-barberman_secret_key_123}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-barber_man}
      WHATSAPP_SENDER_PHONE: ${WHATSAPP_SENDER_PHONE:-}
      WHATSAPP_NOTIFY_OWNER: ${WHATSAPP_NOTIFY_OWNER:-true}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - barber_man_network

  # Gerenciamento e Monitoramento de Containers - Portainer CE
  portainer:
    image: portainer/portainer-ce:latest
    container_name: barber_man_portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - barber_man_network

  # WhatsApp Gateway - Evolution API v2 (Open Source)
  evolution_api:
    image: atendai/evolution-api:v2.1.2
    container_name: barber_man_evolution_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8080}
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-barberman_secret_key_123}
      DATABASE_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - barber_man_network

volumes:
  pgdata:
    driver: local
  portainer_data:
    driver: local
  evolution_instances:
    driver: local

networks:
  barber_man_network:
    driver: bridge
