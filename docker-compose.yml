services:
  # Base de Dados Relacional - PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: caios_barber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caios_barber_network

  # Gerenciador Web de Banco de Dados - Adminer
  adminer:
    image: adminer:latest
    container_name: caios_barber_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - caios_barber_network

  # Aplicacao Web Frontend - Vue 3
  frontend:
    image: nginx:alpine
    container_name: caios_barber_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - caios_barber_network

volumes:
  pgdata:
    driver: local

networks:
  caios_barber_network:
    driver: bridge
