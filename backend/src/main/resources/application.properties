# Configuracoes da Aplicacao Spring Boot - Barber Man

spring.application.name=barber-man-api
server.port=${API_PORT:8081}
server.servlet.context-path=/api

# Conexao com Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres_db}:${DB_PORT:5432}/${DB_NAME:barber_man_db}
spring.datasource.username=${DB_USER:barber_man_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson / JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
